<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hotel Booking</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <img src="images/logo.png" alt="City Logo" class="logo">
  <h1>Welcome to CityName Tourism</h1>
  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="heritage.html">Heritage</a></li>
      <li><a href="booking.html">Hotel Booking</a></li>
      <li><a href="gallery.html">Gallery</a></li>
    </ul>
  </nav>
</header>

<main>
  <h2>Hotel Booking Form</h2>
  <form>
    <label>Name: <input type="text" required></label><br>
    <label>Email: <input type="email" required></label><br>
    <label>Check-in Date: <input type="date" required></label><br>
    <label>Check-out Date: <input type="date" required></label><br>
    <label>Room Type:
      <select>
        <option>Single</option>
        <option>Double</option>
        <option>Suite</option>
      </select>
    </label><br>
    <button type="submit">Book Now</button>
  </form>
</main>
</body>
</html>
